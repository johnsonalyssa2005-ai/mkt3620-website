<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alyssa Johnson | Interactive Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #faf5f7; /* Very soft cream/pink background */
            color: #4a3e43; /* Soft dark mauve for easy reading */
        }

        /* --- Global Navigation Bar Styles --- */
        .navbar {
            background-color: #d8a7b1; /* Dusty aesthetic rose */
            position: sticky;
            top: 0;
            width: 100%;
            box-shadow: 0 2px 10px rgba(184, 137, 147, 0.2);
            z-index: 1000;
        }
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 60px;
        }
        .nav-brand {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .nav-links {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
            gap: 25px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .nav-links a:hover {
            color: #fbe3e8; /* Soft blush highlight on hover */
        }

        /* --- Page Layout & Component Styles --- */
        .page-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 60px);
        }
        .container {
            max-width: 650px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(216, 167, 177, 0.15);
            text-align: center;
            margin: 20px;
            border: 1px solid #f1d4db;
        }
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fbe3e8;
            outline: 3px solid #d8a7b1;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #b86b7d; /* Deep rose title */
            margin-bottom: 10px;
            font-weight: 700;
        }
        p.intro {
            font-size: 1.15rem;
            color: #63535a;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #d8a7b1; /* Dusty rose button */
            color: #ffffff;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 30px; /* Rounded pill style */
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(216, 167, 177, 0.3);
        }
        .btn:hover {
            background-color: #b86b7d;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(184, 107, 125, 0.35);
        }
    </style>

    <script src="nav.js" defer></script>
</head>
<body>

    <main class="page-content">
        <div class="container">
            <!-- Profile Picture -->
            <img src="profile.jpg" alt="Alyssa Johnson Headshot" class="profile-img">

            <h1>Welcome</h1>
            <p class="intro">
                Hello! My name is Alyssa Johnson. I am a senior at Iowa State University studying Marketing. 
                This is my interactive portfolio showcasing my skills and goals. I hope you enjoy and 
                please feel free to reach out to me!
            </p>
            <a href="mailto:your-email@iastate.edu" class="btn">Get in Touch</a>
        </div>
    </main>

</body>
</html>
