<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Alyssa Johnson</title>
    <style>
        :root {
            --bg-color: #faf5f7;          /* Soft cream/pink background */
            --primary-rose: #d8a7b1;      /* Main dusty rose accent */
            --primary-rose-hover: #b86b7d;/* Deep rose title & hover state */
            --accent-blush: #fbe3e8;      /* Soft blush highlight */
            --border-pink: #f1d4db;       /* Subtle pink border */
            --text-dark: #4a3e43;          /* Dark mauve body text */
            --text-muted: #63535a;         /* Muted subtext */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        /* Nav Styles */
        .navbar {
            background-color: var(--primary-rose);
            position: sticky;
            top: 0;
            width: 100%;
            box-shadow: 0 2px 10px rgba(184, 137, 147, 0.2);
            z-index: 1000;
        }
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 60px;
        }
        .nav-brand {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .nav-links {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
            gap: 25px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .nav-links a:hover {
            color: var(--accent-blush);
        }

        /* Page Layout Styles */
        .page-content {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: calc(100vh - 60px);
        }
        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(216, 167, 177, 0.15);
            border: 1px solid var(--border-pink);
            width: 100%;
        }
        h1 {
            color: var(--primary-rose-hover);
            margin-top: 0;
            font-weight: 700;
        }
        p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }
        ul {
            padding-left: 20px;
            color: var(--text-dark);
        }
        li {
            margin-bottom: 12px;
            line-height: 1.6;
        }
        li strong {
            color: var(--primary-rose-hover);
        }
    </style>
    <script src="nav.js" defer></script>
</head>
<body>

    <main class="page-content">
        <div class="container">
            <h1>Projects</h1>
            <p>Welcome to my portfolio showcase. Here are some marketing strategies, case studies, and campaigns I have worked on:</p>
            <ul>
                <li><strong>Marketing Strategy Case Study</strong> - Marketing Alani Nu Campaign for class study.</li>
                <li><strong>Digital Campaign Proposal</strong> - Bloom energy digital marketing content creation showcase.</li>
            </ul>
        </div>
    </main>

</body>
</html>
